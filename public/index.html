<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FHIR Foundational Prep</title>
  <meta name="description" content="Study notes for the HL7 FHIR Foundational Implementer exam, organised by the official competencies.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" type="button" aria-label="Open topics" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <a class="topbar-title" href="#overview">FHIR Foundational Prep</a>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Exam topics">
      <div class="brand">
        <a href="#overview" class="brand-link">
          <span class="brand-mark" aria-hidden="true">R4</span>
          <span class="brand-text">
            <span class="brand-name">FHIR Foundational Prep</span>
            <span class="brand-sub">HL7 Foundational Implementer exam</span>
          </span>
        </a>
      </div>
      <div class="search">
        <label for="topic-filter" class="visually-hidden">Filter topics</label>
        <input id="topic-filter" type="search" placeholder="Filter topics" autocomplete="off">
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="progress" id="progress"></div>
        <div class="admin-box" id="admin-box"></div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main" id="main" tabindex="-1">
      <div class="loading">Loading topics…</div>
    </main>
  </div>

  <dialog id="login-dialog" class="dialog" aria-labelledby="login-title">
    <form id="login-form" method="dialog">
      <h2 id="login-title">Admin sign-in</h2>
      <p class="dialog-help">Sign in to edit the study notes.</p>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="login-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="login-submit">Sign in</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
